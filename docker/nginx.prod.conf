events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 8088;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Static frontend from /www
        root /www;
        index index.html;

        # Frontend routes — serve .html files, fallback to index.html
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }

        # Cache static assets aggressively
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Auth rate limiting
        location /api/token {
            limit_req zone=auth burst=5 nodelay;
            client_max_body_size 100M;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Streaming endpoint for AcousticLab demo loader (long-running ndjson)
        location /api/acoustic/samples/load {
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering so each ndjson line reaches the client live
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Up to 1 hour for download + extract + import + compute
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Backend API routes
        location /api {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 100M;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
